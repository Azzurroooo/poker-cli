[project]
name = "real-poker"
version = "0.1.0"
description = "LAN multiplayer Texas Hold'em for the terminal"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "prompt_toolkit>=3",
]

[project.scripts]
realpoker = "rpoker.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpoker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
